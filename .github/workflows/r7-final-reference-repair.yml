name: R7 Final Repair
on:
  push:
    branches:
      - ai/r7-reference-reconciliation
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/r7-reference-reconciliation
      - run: python scripts/r7_final_patch.py
      - name: Commit documentation repair
        shell: bash
        run: |
          if git diff --quiet -- docs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: finalize Detailed Design reference repair"
          git push origin HEAD:ai/r7-reference-reconciliation
